name: Attendance regression
on:
  pull_request:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
  workflow_dispatch:
    inputs:
      live:
        description: Verify the approved published app instead of localhost
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  regression:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}
          TARGET_URL: ${{ (inputs.live || github.event_name == 'workflow_run') && 'https://melinahargrove-droid.github.io/little-attendance/' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attendance-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/
