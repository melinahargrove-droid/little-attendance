name: Attendance regression
on:
  pull_request:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
  workflow_dispatch:
    inputs:
      live:
        description: Verify the approved published app instead of localhost
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  regression:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ${{ matrix.browser == 'chromium' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}
          TARGET_URL: ${{ (inputs.live || github.event_name == 'workflow_run') && 'https://melinahargrove-droid.github.io/little-attendance/' || '' }}
      - run: node tests/bfcache-browser.cjs
        if: matrix.browser == 'chromium'
        env:
          TARGET_URL: ${{ (inputs.live || github.event_name == 'workflow_run') && 'https://melinahargrove-droid.github.io/little-attendance/' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pumpkin-mask-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/pumpkin-mask-*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-mask-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/apple-mask-*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-frame-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/review-frame-*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-pumpkin-patch-${{ matrix.browser }}-${{ github.sha }}
          path: |
            test-results/restored-pumpkin-patch-1280-10-*.png
            test-results/restored-pumpkin-patch-1280-30-*.png
            test-results/restored-pumpkin-patch-1024-10-*.png
            test-results/restored-pumpkin-patch-1024-30-*.png
            test-results/restored-themes-matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-halloween-${{ matrix.browser }}-${{ github.sha }}
          path: |
            test-results/restored-halloween-1280-10-*.png
            test-results/restored-halloween-1280-30-*.png
            test-results/restored-halloween-1024-10-*.png
            test-results/restored-halloween-1024-30-*.png
            test-results/restored-themes-matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-our-friends-${{ matrix.browser }}-${{ github.sha }}
          path: |
            test-results/restored-our-friends-1280-10-*.png
            test-results/restored-our-friends-1280-30-*.png
            test-results/restored-our-friends-1024-10-*.png
            test-results/restored-our-friends-1024-30-*.png
            test-results/restored-themes-matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-preview-${{ matrix.browser }}-${{ github.sha }}
          path: |
            test-results/theme-preview-*.png
            test-results/theme-preview-geometry.json
            test-results/browser-results.json
            test-results/live-byte-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attendance-${{ matrix.browser }}-${{ github.sha }}
          path: |
            test-results/**
            !test-results/bus-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bus-1671-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/bus-1671-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bus-1280-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/bus-1280-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bus-1181-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/bus-1181-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bus-1024-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/bus-1024-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bus-portrait-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/bus-portrait-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bus-readable-1280-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/bus-readable-1280-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bus-readable-1024-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/bus-readable-1024-*.png
