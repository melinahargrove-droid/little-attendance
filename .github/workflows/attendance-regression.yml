name: Attendance regression
on:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Verify the approved published app instead of localhost
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}
          TARGET_URL: ${{ inputs.live && 'https://melinahargrove-droid.github.io/little-attendance/' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attendance-${{ matrix.browser }}-${{ github.sha }}
          path: test-results/
